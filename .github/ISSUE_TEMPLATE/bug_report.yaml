name: Bug report
description: Report a reproducible problem in Sod
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Sod. Reports may be written in English, Russian, or French.

        Never include subscription URLs, proxy credentials, UUIDs, tokens, or unsanitized configuration files.
  - type: checkboxes
    id: search
    attributes:
      label: Existing reports
      options:
        - label: I searched the existing issues for the same problem.
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: "Samsung S23 Ultra, Android 16 / Windows 11 25H2"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sod version
      placeholder: "1.0.1-beta.1"
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Country and internet provider
      description: Optional, but very useful for discovery and connection failures.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Sod
        2. Start discovery
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove every credential, UUID, subscription URL, and personal detail before posting.
      render: shell
